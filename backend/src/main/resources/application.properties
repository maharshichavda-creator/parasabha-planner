spring.application.name=planner

# --- Database (PostgreSQL) ---
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:1522}/${DB_NAME:parasabha_planner}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Finastra}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Server ---
# Render (and most PaaS) inject $PORT at runtime; falls back to $SERVER_PORT or 8080 locally.
server.port=${PORT:${SERVER_PORT:8080}}

# --- CORS ---
# Comma-separated list of allowed frontend origins (e.g. your deployed Render static site URL).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
