databases:
  - name: parasabha-planner-db
    databaseName: parasabha_planner
    user: parasabha
    plan: free

services:
  # --- Backend: Spring Boot REST API (Docker) ---
  - type: web
    name: parasabha-planner-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/mandals
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: parasabha-planner-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: parasabha-planner-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: parasabha-planner-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: parasabha-planner-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: parasabha-planner-db
          property: password
      # Update this if Render assigns your frontend a different URL (e.g. due to a name clash).
      - key: CORS_ALLOWED_ORIGINS
        value: https://parasabha-planner-frontend.onrender.com

  # --- Frontend: Angular static site ---
  - type: web
    name: parasabha-planner-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build:render
    staticPublishPath: dist/frontend/browser
    envVars:
      # Update this if Render assigns your backend a different URL (e.g. due to a name clash).
      - key: API_BASE_URL
        value: https://parasabha-planner-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
