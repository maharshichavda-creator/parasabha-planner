name: Build Android Debug APK

on:
  # Run automatically whenever app/mobile code changes land on main
  push:
    branches: [main]
    paths:
      - 'frontend/src/**'
      - 'frontend/android/**'
      - 'frontend/public/**'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'frontend/capacitor.config.ts'
      - 'frontend/angular.json'
      - '.github/workflows/build-android-apk.yml'
  # Also allow manually triggering from the Actions tab
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build mobile web bundle and sync Capacitor
        working-directory: frontend
        run: npm run cap:sync

      - name: Grant execute permission to gradlew
        working-directory: frontend/android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Copy APK into downloads folder
        run: cp frontend/android/app/build/outputs/apk/debug/app-debug.apk frontend/public/downloads/parasabha-planner-debug.apk

      - name: Commit and push APK
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/public/downloads/parasabha-planner-debug.apk
          if git diff --cached --quiet; then
            echo "No changes to the APK; skipping commit."
          else
            git commit -m "chore(android): rebuild debug APK via GitHub Actions [skip ci]"
            git push origin HEAD:main
          fi
