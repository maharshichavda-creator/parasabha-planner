services:
  postgres:
    image: postgres:16-alpine
    container_name: parasabha-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: parasabha_planner
      POSTGRES_USER: parasabha
      POSTGRES_PASSWORD: parasabha
    ports:
      - "5432:5432"
    volumes:
      - parasabha-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parasabha -d parasabha_planner"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  parasabha-postgres-data:
